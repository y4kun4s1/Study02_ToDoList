<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>📝 오늘의 할 일</h1>
      <time id="today"></time>
    </header>

    <section class="progress" aria-label="진행률">
      <div id="progress-summary" class="progress-summary"></div>
      <div id="progress-track" class="progress-track" role="progressbar"
           aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <ul id="progress-categories" class="progress-categories"></ul>
    </section>

    <form id="add-form" class="add-form">
      <input id="add-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" aria-label="할 일 입력" autocomplete="off">
      <select id="add-category" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav id="filters" class="filters" aria-label="카테고리 필터">
      <button type="button" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" data-filter="work" aria-pressed="false">업무</button>
      <button type="button" data-filter="personal" aria-pressed="false">개인</button>
      <button type="button" data-filter="study" aria-pressed="false">공부</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty-message" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
